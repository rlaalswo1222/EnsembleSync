# Oracle Cloud(Ampere A1 / ARM) 배포용 구성.
#
# EC2 배포용(docker-compose.prod.yml)과 다른 점:
#  - PostgreSQL/Redis/Caddy 를 전부 컨테이너로 올린다. 메모리가 12GB 라
#    호스트에 따로 설치할 이유가 없고, docker compose up 한 번으로 전체
#    스택이 완성된다.
#  - network_mode: host 를 쓰지 않는다. 컨테이너끼리는 서비스 이름으로
#    통신하고, 외부 노출은 caddy 의 80/443 만 열린다.
#  - 이미지는 이 서버(ARM)에서 직접 빌드한다. amd64 이미지는 동작하지 않는다.
#
# 서버의 파일 배치 (DDL 경로가 ../ 이므로 이 구조를 지켜야 한다):
#   /home/ubuntu/ensemblesync_ddl.sql
#   /home/ubuntu/server/          ← 이 파일과 소스가 여기
#   /home/ubuntu/uploads/         ← 업로드 파일 (EC2 에서 옮겨옴)
#
# 주의: 컨테이너는 uid 1000(app) 으로 실행되는데 Oracle Ubuntu 의 ubuntu 유저는
# uid 1001 이다(EC2 는 1000 이었다). uploads 소유권이 1001 이면 컨테이너가 쓰지
# 못하므로 이전 후 한 번 맞춰줘야 한다:
#   sudo chown -R 1000:1000 /home/ubuntu/uploads
#
# 사용법:
#   cd ~/server
#   docker compose -f docker-compose.oracle.yml up -d --build

x-backend-env: &backend-env
  DB_HOST: db
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  # 파일 주소 서명 열쇠. 비워두면 uploads/.signing_key 에 스스로 만들어
  # 쓴다(api 와 워커가 그 폴더를 함께 쓰므로 같은 값을 보게 된다). 서버를
  # 여러 대로 늘리거나 열쇠를 갈아야 할 때만 여기서 지정한다.
  FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET:-}
  # 서버 밖에 있는 일꾼이 결과를 되돌려 보낼 때 쓰는 열쇠.
  # 비어 있으면 그 창구가 닫힌다 — 원격 일꾼을 안 쓰는 동안에는 그게 맞다.
  WORKER_SECRET: ${WORKER_SECRET:-}

x-logging: &logging
  # 도커 로그가 무한정 쌓여 디스크를 잠식하는 것을 막는다
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Redis 와 같은 이유로 127.0.0.1 에만 연다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 최초 기동 시에만 실행된다. EC2 덤프를 복원할 계획이면 그 전에
      # 이 파일로 빈 스키마가 먼저 만들어져도 무방하다.
      - ../ensemblesync_ddl.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # 127.0.0.1 에만 연다. 밖에서는 닿지 않고, 서버에 SSH 로 들어온
    # 터널만 볼 수 있다. 집 데스크탑을 일꾼으로 붙일 때 그 터널을 쓴다.
    #
    # 0.0.0.0 으로 열면 안 된다. Redis 는 기본적으로 암호가 없어서
    # 공개되는 순간 누구나 큐를 읽고 쓸 수 있다.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    build: .
    image: ensemblesync-api
    # 외부에는 caddy 만 노출한다. api 포트는 열지 않는다.
    environment: *backend-env
    volumes:
      - /home/ubuntu/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  worker-bpm:
    image: ensemblesync-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A bpm_analyze.celery_app worker --loglevel=info -Q bpm -n bpm@%h
    environment: *backend-env
    volumes:
      - /home/ubuntu/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  worker-separation:
    # 빌드 정의는 worker-bpm 한 곳에만 둔다. 두 서비스가 같은 태그를 동시에
    # export 하려다 "image already exists" 로 빌드가 실패한다.
    image: ensemblesync-worker
    pull_policy: never
    # --concurrency=1 을 반드시 준다. 안 주면 Celery 가 코어 수만큼(여기서는
    # 2개) 프로세스를 띄워 곡 두 개를 동시에 돌린다.
    #
    # 실측(3분 20초 곡, htdemucs, 2 OCPU):
    #   혼자      302초  코어 1.85개 사용  메모리 2.0GB
    #   동시 둘   584초  각 0.98개        메모리 4.1GB
    #
    # demucs 는 혼자서도 코어를 거의 다 쓴다. 둘을 겹쳐도 같은 코어를 나눠
    # 가질 뿐이라 두 곡 처리에 604초 대신 584초, 3% 빨라지는 게 전부다.
    # 그 3% 를 얻자고 첫 사람의 대기가 302초에서 584초로 늘고 메모리가 두
    # 배가 된다. 남는 장사가 아니다.
    #
    # 대기 순번·예상 시간 계산(audio_analysis._queue_info)도 한 번에 하나를
    # 전제로 짜여 있다.
    command: celery -A track_separate.celery_app worker --loglevel=info -Q separation -n separation@%h --concurrency=1
    environment: *backend-env
    volumes:
      - /home/ubuntu/uploads:/app/uploads
      # demucs 모델 가중치 캐시 (재시작마다 다시 받지 않도록)
      - modelcache:/home/app/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 예) 152-70-1-2.sslip.io  — 인스턴스 공인 IP 로 정한다
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서를 보존한다. 없으면 재시작마다 재발급을 시도하다
      # Let's Encrypt 발급 한도에 걸린다.
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  # 정리 태스크 스케줄러. 매일 새벽 4시에 cleanup_separated 를 bpm 큐로 보낸다.
  beat:
    image: ensemblesync-worker
    pull_policy: never
    command: celery -A celery_app.celery_app beat --loglevel=info
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  modelcache:
  caddydata:
  caddyconfig:
