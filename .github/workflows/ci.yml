# 이 워크플로우의 이름 (GitHub Actions 탭에 표시됨)
name: CI

# 언제 실행할지
on:
  # master / develop 에 직접 push 될 때
  push:
    branches: [master, develop]
  # master / develop 로 향하는 PR이 올라오거나 갱신될 때
  pull_request:
    branches: [master, develop]

jobs:
  flutter:
    name: Flutter 검사
    # GitHub가 제공하는 우분투 가상머신에서 실행
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드를 가상머신으로 내려받는다
      - name: 코드 내려받기
        uses: actions/checkout@v4

      # 2. Flutter SDK 설치 (로컬과 동일한 버전으로 고정)
      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      # 3. pubspec.lock 기준으로 패키지 설치
      - name: 의존성 설치
        run: flutter pub get

      # 4. 린트 검사 (analysis_options.yaml 규칙 적용)
      - name: 린트 검사
        run: flutter analyze

      # 5. 테스트 실행
      - name: 테스트
        run: flutter test
